name: Build Realme 5 Pro (LanceX Pure Kernel A15)

on:
  workflow_dispatch:
  push:
    branches: [ ci/lancex-build ]
    paths:
      - '.github/workflows/build-realme-5pro-lancex-a15.yml'

env:
  # Device env
  DEVICE_NAME : "realme_5_pro"
  DEVICE_CODENAME : "RMX1971"

  # LLVM=1 is honoured by this 4.9 tree (Makefile has ifneq ($(LLVM),) and LLVM_IAS blocks).
  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LD=ld.lld LLVM=1 LLVM_IAS=1"

  KERNEL_SOURCE : "https://github.com/LanceX-Mirror/LanceX.git"
  KERNEL_BRANCH : "bump-4.10"

  # proton-clang ships its own aarch64/arm cross GCC prefix; build-env auto-sets both when the URL matches *proton*.
  CLANG_SOURCE : "https://github.com/kdrag0n/proton-clang.git"
  CLANG_BRANCH : "master"

  GCC_GNU : false
  GCC_64_SOURCE : ""
  GCC_64_BRANCH : ""
  GCC_32_SOURCE : ""
  GCC_32_BRANCH : ""

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "sdm670-perf_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  # Root: backslashxx/KernelSU pinned to a tag, cloned by build-ready's manual path.
  # Nothing is committed to LanceX; the driver only ever exists in the CI workspace.
  KERNELSU_SOURCE : "https://github.com/backslashxx/KernelSU.git"
  KERNELSU_BRANCH : "v3.3.1+21"
  KERNELSU_AUTO_GET : "false"
  KERNELSU_AUTO_FORK : "xxksu"
  KERNELSU_METHOD : "manual"

  SUSFS_ENABLE : false
  SUSFS_FIXED : false

  REKERNEL_ENABLE: false
  DROIDSPACES_ENABLE: false
  NOMOUNT_ENABLE: false
  BASEBAND_GUARD_ENABLE: false
  BASEBAND_GUARD_BOOT: false
  KPM_ENABLE: false
  KPM_INLINE: false
  KPM_KPATCH_NEXT: false

  # AnyKernel3 branch LanceX already targets RMX1971 (device.name1) with the correct boot BLOCK,
  # so no osm0sis-path sed rewriting is needed or applied.
  AK3_SOURCE : "https://github.com/LanceX-Mirror/AnyKernel3.git"
  AK3_BRANCH : "LanceX"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "aosp_a15"

  # Other env
  PYTHON_VERSION: "3"

  PACK_METHOD: "AnyKernel3"
  PACK_KMODULES: "false"

  PATCHES_SOURCE: ""
  PATCHES_BRANCH: ""
  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""
  HOOK_METHOD: "syscall"
  KPM_PATCH_SOURCE: ""

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "true"
  SKIP_PATCH: "true"

  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "true"

jobs:
  build-kernel:
    name: Realme 5 Pro (LanceX Pure Kernel A15)
    runs-on: ubuntu-24.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: Extra Kernel Options
        run: |
          cd $GITHUB_WORKSPACE

          # proton-clang ships a host ld that cannot link HOSTCC tools; the cross ld is aarch64-linux-gnu-ld.
          if [ -f "$GITHUB_WORKSPACE/clang-custom/bin/ld" ]; then
            mv "$GITHUB_WORKSPACE/clang-custom/bin/ld" "$GITHUB_WORKSPACE/clang-custom/bin/ld.proton.host.bak"
            echo "[+] sidelined proton host ld"
          fi

          # Runner-side config injection: the repo defconfig stays untouched.
          CFG="$GITHUB_WORKSPACE/device_kernel/arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_LSM_SECURITY_HOOKS=y"
            echo "# CONFIG_KSU_KPROBES_KSUD is not set"
            echo "CONFIG_KSU_TAMPER_SYSCALL_TABLE=y"
            echo "# CONFIG_KSU_HACK_ARM64_BRANCH_LINK is not set"
          } >> "$CFG"

          echo "[+] defconfig: ${{ env.DEFCONFIG_NAME }} (KSU injected on runner)"
          echo "[+] branch: ${{ env.KERNEL_BRANCH }}"
          tail -5 "$CFG"

      - name: Audit provenance and purity
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          echo "[+] HEAD: $(git rev-parse HEAD)"
          echo "[+] working tree changes:"
          git status --porcelain | head -20
          echo "[+] KSU driver symlink: $(readlink drivers/kernelsu || echo MISSING)"
          echo "[+] KSU version: $(grep -h 'KSU_VERSION=' KernelSU/kernel/Makefile 2>/dev/null || echo '?')"
          echo "[+] KSU config on runner defconfig:"
          grep -n 'CONFIG_KSU' arch/arm64/configs/${{ env.DEFCONFIG_NAME }} || true

      - name: Build Process
        uses: ./.github/workflows/build-process

      - name: Verify built kernel (config, ISA, KSU symbols)
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          echo "=== FINAL .config (KSU) ==="
          grep -E '^CONFIG_KSU' out/.config | sort || echo "NO CONFIG_KSU IN .config"
          echo "=== TAMPER must be y ==="
          grep -E '^CONFIG_KSU_TAMPER_SYSCALL_TABLE' out/.config || echo "TAMPER MISSING"
          echo "=== COMPAT must be y ==="
          grep -E '^CONFIG_COMPAT=' out/.config || echo "COMPAT MISSING"
          echo "=== FINAL .config (LOCALVERSION) ==="
          grep -E '^CONFIG_LOCALVERSION' out/.config || true
          echo "=== vmlinux present? ==="
          ls -l out/vmlinux 2>/dev/null || echo "out/vmlinux MISSING"
          echo "=== ldapr count (must be 0 on armv8.2) ==="
          llvm-objdump -d out/vmlinux 2>/dev/null | grep -c ldapr || true
          echo "=== KSU symbols in vmlinux ==="
          llvm-nm out/vmlinux 2>/dev/null | grep -c ksu_ || true
          echo "=== ksu.o built ==="
          ls -l out/drivers/kernelsu/ 2>/dev/null || echo "no out/drivers/kernelsu"
          echo "=== Image.gz-dtb ==="
          ls -l out/arch/arm64/boot/Image.gz-dtb 2>/dev/null || echo MISSING
          echo "=== decompressed kernel strings ==="
          gzip -dc out/arch/arm64/boot/Image.gz-dtb 2>/dev/null > /tmp/Image.raw || true
          ls -l /tmp/Image.raw 2>/dev/null || echo "decompress failed"
          strings -n 8 /tmp/Image.raw 2>/dev/null | grep -c -i kernelsu || true
          strings -n 8 /tmp/Image.raw 2>/dev/null | grep -m1 -E "^Linux version" || true
          echo "=== kernel release ==="
          cat out/include/config/kernel.release 2>/dev/null || echo none

      - name: Pack Process
        uses: ./.github/workflows/pack-process

      - name: Upload Artifacts
        uses: ./.github/workflows/upload-files
