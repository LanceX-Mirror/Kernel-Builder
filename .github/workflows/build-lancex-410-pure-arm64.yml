name: Build LanceX 4.10 pure (arm64 runner, ccache export)
# Purpose: build bump-4.10 (pure kernel, no KernelSU) on a GitHub-hosted arm64
# runner with the same LLVM 13.0.0 aarch64 toolchain as the local device, and
# export the aarch64 ccache as an artifact so local rebuilds can hit it.

on:
  workflow_dispatch:
  push:
    branches: [ ci/lancex-410-arm64 ]
    paths:
      - '.github/workflows/build-lancex-410-pure-arm64.yml'

env:
  KERNEL_REPO: "https://github.com/LanceX-Mirror/LanceX.git"
  KERNEL_BRANCH: "bump-4.10"
  AK3_REPO: "https://github.com/LanceX-Mirror/AnyKernel3.git"
  AK3_BRANCH: "LanceX"
  DEFCONFIG: "sdm670-perf_defconfig"
  LLVM_URL: "https://github.com/llvm/llvm-project/releases/download/llvmorg-13.0.0/clang+llvm-13.0.0-aarch64-linux-gnu.tar.xz"
  LLVM_SHA256: "968d65d2593850ee9b37fcda074fb7641529bd45d2f976af6c8197de3c22612f"

jobs:
  build:
    name: LanceX 4.10 pure (arm64)
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90
    env:
      CCACHE_DIR: "${{ github.workspace }}/.ccache"
      CCACHE_COMPILERCHECK: "content"
      CCACHE_BASEDIR: "${{ github.workspace }}/device_kernel"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      CCACHE_NOCOMPRESS: "true"

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git bc bison flex libssl-dev libelf-dev openssl make gcc g++ binutils \
            cpio device-tree-compiler lz4 zstd xz-utils zip unzip python3 \
            ccache libtinfo5 binutils-arm-linux-gnueabi

      - name: Download official LLVM 13.0.0 aarch64
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/llvm13.tar.xz "$LLVM_URL"
          echo "$LLVM_SHA256  /tmp/llvm13.tar.xz" | sha256sum -c -
          mkdir -p "$GITHUB_WORKSPACE/clang-custom"
          tar -xJf /tmp/llvm13.tar.xz -C "$GITHUB_WORKSPACE/clang-custom" --strip-components=1
          export PATH="$GITHUB_WORKSPACE/clang-custom/bin:$PATH"
          clang --version
          ld.lld --version
          command -v clang ld.lld llvm-ar
          clang -print-resource-dir
          command -v aarch64-linux-gnu-elfedit
          command -v arm-linux-gnueabi-ld

      - name: Clone kernel and AnyKernel3
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" device_kernel
          git clone --depth=1 -b "$AK3_BRANCH" "$AK3_REPO" AnyKernel3
          cd device_kernel
          echo "[+] kernel HEAD: $(git rev-parse HEAD)"
          git log --oneline -2

      - name: Configure pure defconfig
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/clang-custom/bin:$PATH"
          cd "$GITHUB_WORKSPACE/device_kernel"

          make O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            "$DEFCONFIG"

          make O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            olddefconfig

          echo "=== purity check ==="
          if grep -q '^CONFIG_KSU=y' out/.config; then
            echo "CONFIG_KSU unexpectedly enabled" >&2
            exit 1
          fi
          grep -E '^CONFIG_(LOCALVERSION|COMPAT|COMPAT_VDSO)=' out/.config || true

      - name: Record compiler provenance
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/clang-custom/bin:$PATH"
          cd "$GITHUB_WORKSPACE/device_kernel"
          {
            echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
            echo "kernel_head=$(git rev-parse HEAD)"
            echo "clang_path=$(command -v clang)"
            echo "clang_resource_dir=$(clang -print-resource-dir)"
            clang --version
            ld.lld --version
            sha256sum "$(command -v clang)"
            ccache --version
            echo "--- ccache config ---"
            ccache -p
            echo "--- ccache env ---"
            env | grep '^CCACHE_' | sort
          } | tee ccache-env.txt

      - name: Build kernel with ccache
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/clang-custom/bin:$PATH"
          cd "$GITHUB_WORKSPACE/device_kernel"

          mkdir -p "$CCACHE_DIR"
          ccache --version
          ccache --zero-stats

          make -j"$(nproc)" O=out ARCH=arm64 \
            CC="ccache clang" LD=ld.lld LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            2>&1 | tee build.log

          ccache -s | tee ccache-stats.txt

      - name: Verify kernel image
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/device_kernel"
          echo "=== kernel image ==="
          ls -l out/arch/arm64/boot/Image.gz-dtb
          cat out/include/config/kernel.release
          # The appended DTB makes gzip report trailing garbage (exit 2).
          gzip -dc out/arch/arm64/boot/Image.gz-dtb > /tmp/Image.raw || true
          strings -n 8 /tmp/Image.raw | grep -m1 -E '^Linux version'

          { echo '### ccache'; ccache -s; } >> "$GITHUB_STEP_SUMMARY"

      - name: Pack AnyKernel3 zip
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -rf ak3-pack
          mkdir -p ak3-pack
          cp -a AnyKernel3/. ak3-pack/
          cp device_kernel/out/arch/arm64/boot/Image.gz-dtb ak3-pack/
          cd ak3-pack
          zip -r9 "$GITHUB_WORKSPACE/RMX1971-aosp_a15-410-pure-arm64.zip" .
          ls -l "$GITHUB_WORKSPACE/RMX1971-aosp_a15-410-pure-arm64.zip"

      - name: Tar ccache for download
        if: always()
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p .ccache
          tar -cf ccache-aarch64-410.tar .ccache
          ls -l ccache-aarch64-410.tar
          sha256sum ccache-aarch64-410.tar | tee ccache-aarch64-410.tar.sha256

      - name: Upload ccache artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ccache-aarch64-410-pure
          path: ccache-aarch64-410.tar
          compression-level: 0
          retention-days: 7

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-410-pure-arm64
          path: |
            RMX1971-aosp_a15-410-pure-arm64.zip
            ccache-aarch64-410.tar.sha256
            device_kernel/build.log
            device_kernel/ccache-stats.txt
            device_kernel/ccache-env.txt
          if-no-files-found: warn
          retention-days: 7
